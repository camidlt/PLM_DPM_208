<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Propriétaire Battery Passport</title><link rel="stylesheet" href="/app/common.css"></head>
<body>
<header><h1>🏭 Gestion du Battery Passport</h1><span class="role">Rôle : Propriétaire (constructeur) · <a href="/" style="color:var(--muted)">changer</a></span></header>
<main>
  <div class="card"><h2>Notifications</h2><div id="notifs"></div></div>
  <div class="grid2">
    <div class="card"><h2>Batterie</h2><div id="id"></div></div>
    <div class="card"><h2>Mettre à jour le statut</h2>
      <select id="status"></select>
      <input id="comment" placeholder="Justification (ex. : diagnostic garage du jour)" style="margin-top:10px">
      <div class="row" style="margin-top:10px"><button id="save">Enregistrer le statut</button></div>
      <p class="muted">Règle : seul le propriétaire peut modifier le statut. « Waste » est définitif.</p>
    </div>
  </div>
  <div class="card"><h2>Fiche technique</h2><div id="tech"></div></div>
  <div class="card"><h2>Preuves : télémétrie BMS</h2><div class="modules" id="modules"></div></div>
  <div class="card"><h2>Historique</h2><div id="events"></div></div>
</main>
<script src="/app/common.js"></script>
<script>
  let filled = false;
  async function refresh() {
    const [p, notifs] = await Promise.all([api(`/api/batteries/${BID}`), api(`/api/notifications?role=owner`)]);
    document.getElementById("id").innerHTML = identity(p);
    document.getElementById("tech").innerHTML = techSheet(p);
    document.getElementById("modules").innerHTML = moduleCards(p);
    document.getElementById("events").innerHTML = timeline(p.events);
    const mine = notifs.filter(n => n.batteryId === BID);
    document.getElementById("notifs").innerHTML = mine.length ? mine.map(n =>
      `<div class="${n.read ? "info" : "alert"}" style="margin-bottom:8px">${n.read ? "✔️" : "🔔 <b>NOUVEAU</b> —"} ${n.message}
       <div class="muted">${fmtTs(n.ts)}</div></div>`).join("") : `<p class="muted">Aucune notification.</p>`;
    const sel = document.getElementById("status");
    if (!filled) {
      sel.innerHTML = p.statuses.map(s => `<option>${s}</option>`).join("");
      filled = true;
    }
    if (!sel.matches(":focus") && !mine.some(n => !n.read)) sel.value = p.battery.status;
    if (mine.some(n => !n.read)) sel.value = "Waste";
    const locked = p.battery.status === "Waste";
    sel.disabled = locked; document.getElementById("save").disabled = locked;
  }
  document.getElementById("save").onclick = async () => {
    try {
      await api(`/api/batteries/${BID}/status`, { method: "POST", role: "owner",
        body: { newStatus: document.getElementById("status").value, comment: document.getElementById("comment").value } });
      toast("Statut mis à jour dans le Battery Passport"); refresh();
    } catch (e) { toast(e.message); }
  };
  refresh(); setInterval(() => refresh().catch(console.error), 3000);
</script>
</body></html>
