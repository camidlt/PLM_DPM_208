<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centre de tri</title><link rel="stylesheet" href="/app/common.css"></head>
<body>
<header><h1>♻️ Centre de tri</h1><span class="role">Rôle : Recycleur · <a href="/" style="color:var(--muted)">changer</a></span></header>
<main>
  <div class="card"><h2>Contrôle du statut</h2><div id="check"></div>
    <div class="row" style="margin-top:12px">
      <button id="receive" class="secondary">Accuser réception</button>
      <button id="start">Lancer le recyclage</button>
    </div></div>
  <div class="card"><h2>Batterie</h2><div id="id"></div></div>
  <div class="card"><h2>Composition & sécurité (pour le démantèlement)</h2><div id="tech"></div></div>
  <div class="card"><h2>Justification : alertes BMS</h2><div id="alerts"></div></div>
  <div class="card"><h2>Historique</h2><div id="events"></div></div>
</main>
<script src="/app/common.js"></script>
<script>
  async function refresh() {
    const p = await api(`/api/batteries/${BID}`);
    const s = p.battery.status;
    document.getElementById("id").innerHTML = identity(p);
    document.getElementById("tech").innerHTML = techSheet(p);
    document.getElementById("events").innerHTML = timeline(p.events);
    document.getElementById("alerts").innerHTML = p.alerts.length
      ? p.alerts.map(a => `<div class="alert">${a.message}<div class="muted">${fmtTs(a.ts)}</div></div>`).join("")
      : `<p class="muted">Aucune alerte.</p>`;
    const started = p.battery.recyclingStatus === "STARTED";
    document.getElementById("check").innerHTML = started
      ? `<div class="success">♻️ <b>Recyclage en cours</b> depuis ${fmtTs(p.battery.recyclingStartedAt)}</div>`
      : s === "Waste"
        ? `<div class="success">✅ Statut du passeport à jour : ${statusBadge(s)} — la batterie peut être recyclée.</div>`
        : `<div class="alert">⛔ Statut actuel : ${statusBadge(s)}. Le recyclage est bloqué tant que le propriétaire n'a pas passé la batterie en « Waste ».</div>`;
    document.getElementById("start").disabled = s !== "Waste" || started;
    document.getElementById("receive").disabled = !!p.battery.receivedAt;
  }
  document.getElementById("receive").onclick = async () => {
    try { const r = await api(`/api/batteries/${BID}/reception`, { method: "POST", role: "recycler", body: {} });
      toast(r.statusIsWaste ? "Réception enregistrée – statut Waste confirmé" : `Réception enregistrée – statut ${r.status} !`); refresh();
    } catch (e) { toast(e.message); }
  };
  document.getElementById("start").onclick = async () => {
    try { await api(`/api/batteries/${BID}/recycling/start`, { method: "POST", role: "recycler", body: {} });
      toast("Recyclage lancé"); refresh();
    } catch (e) { toast(e.message); }
  };
  refresh(); setInterval(() => refresh().catch(console.error), 3000);
</script>
</body></html>
