<div class="grid two">
  <form method="post" action="{{ url_for('owner_approve', notif_uid=n.uid) }}"
        onsubmit="return confirm('Passer {{ n.batteryId }} en « Waste » et créer l\'ordre de transfert ?')">
    <input type="hidden" name="back" value="{{ request.path }}">
    <p class="small muted">Validation sans modification des paramètres logistiques saisis par le garagiste.</p>
    <button class="btn accent block" style="margin-top:10px" type="submit">✅ Accepter la demande</button>
  </form>
  <form method="post" action="{{ url_for('owner_reject', notif_uid=n.uid) }}">
    <input type="hidden" name="back" value="{{ request.path }}">
    <label>Motif du refus</label>
    <input name="comment" placeholder="ex. batterie encore sous garantie, à renvoyer à l'usine" required>
    <button class="btn ghost block" style="margin-top:10px" type="submit">Refuser la demande</button>
  </form>
</div>
