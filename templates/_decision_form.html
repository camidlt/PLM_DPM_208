<div class="decide">
  <form method="post" action="{{ url_for('owner_approve', notif_uid=n.uid) }}"
        onsubmit="return confirm('Passer {{ n.batteryId }} en Waste et créer l\'ordre de transfert ?')">
    <input type="hidden" name="back" value="{{ request.url.path }}">
    <label for="dest-{{ n.uid }}">Centre de tri de destination</label>
    <select id="dest-{{ n.uid }}" name="destination" required>
      {% for c in centers %}
        <option value="{{ c.uid }}" {% if not c.agreed %}disabled{% endif %}>
          {{ c.name }} ({{ c.city }}) {{ '· agréé ' ~ c.agreementNumber if c.agreed else '· non agréé' }}</option>
      {% endfor %}
    </select>
    <label for="cmt-{{ n.uid }}">Commentaire <span class="mute">(optionnel)</span></label>
    <input id="cmt-{{ n.uid }}" name="comment" placeholder="Enlèvement sous 48 h">
    <button class="btn primary block" style="margin-top:14px" type="submit">{{ icon('check') }} Valider : Original vers Waste et transfert</button>
  </form>
  <form method="post" action="{{ url_for('owner_reject', notif_uid=n.uid) }}">
    <input type="hidden" name="back" value="{{ request.url.path }}">
    <label for="rej-{{ n.uid }}">Motif du refus</label>
    <input id="rej-{{ n.uid }}" name="comment" placeholder="Encore sous garantie, retour usine" required>
    <button class="btn ghost block" style="margin-top:14px" type="submit">{{ icon('x') }} Refuser la demande</button>
  </form>
</div>
