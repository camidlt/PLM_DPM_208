; BMS émulé ESP32 pour le Battery Passport (défi 1)
; Avant de compiler : copier include/secrets.example.h en include/secrets.h et le remplir.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Wi-Fi + Bluetooth classique ne tiennent pas dans la partition par défaut
board_build.partitions = huge_app.csv
