; BMS émulé ESP32 pour le Battery Passport (défi 1)
; Avant de compiler : copier include/secrets.example.h en include/secrets.h et le remplir.
; Mode de communication : COMM_MODE dans src/main.cpp (1 Bluetooth, 2 HTTP, 3 MQTT),
; ou ici avec build_flags = -DCOMM_MODE=3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Bluetooth classique (mode 1) ne tient pas dans la partition par défaut
board_build.partitions = huge_app.csv
build_flags =
    -Wno-deprecated-declarations
lib_deps =
    knolleary/PubSubClient @ ^2.8
