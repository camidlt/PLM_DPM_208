services:
  neo4j:
    image: neo4j:5
    container_name: bp-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser : http://localhost:7474
      - "7687:7687"   # Bolt (utilisé par le backend)
    environment:
      - NEO4J_AUTH=neo4j/hackathon2026
    volumes:
      - neo4j_data:/data
      - ./data:/import

volumes:
  neo4j_data:
